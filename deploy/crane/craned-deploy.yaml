apiVersion: v1
kind: ServiceAccount
metadata:
  name: craned
  namespace: crane-system

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: recommendation-configuration
  namespace: crane-system
data:
  config.yaml: |-
    apiVersion: analysis.crane.io/v1alpha1
    kind: RecommendationConfiguration
    recommenders:
      - name: Replicas
        acceptedResources:
          - kind: Deployment
            apiVersion: apps/v1
          - kind: StatefulSet
            apiVersion: apps/v1
      - name: Resource
        acceptedResources:
          - kind: Deployment
            apiVersion: apps/v1
          - kind: StatefulSet
            apiVersion: apps/v1
      - name: IdleNode
        acceptedResources:
          - kind: Node
            apiVersion: v1
      - name: Volume
        acceptedResources:
          - kind: PersistentVolume
            apiVersion: v1
      - name: Service
        acceptedResources:
          - kind: Service
            apiVersion: v1
      ## Carbon recommenders (Kepler-powered)
      - name: CarbonIdleResource
        config:
          energy-idle-threshold: "0.8"
          observation-window-days: "7"
          min-energy-watts: "0.5"
          cpu-usage-threshold: "0.05"
        acceptedResources:
          - kind: Deployment
            apiVersion: apps/v1
          - kind: StatefulSet
            apiVersion: apps/v1
          - kind: DaemonSet
            apiVersion: apps/v1
          - kind: Node
            apiVersion: v1
          - kind: Pod
            apiVersion: v1
      - name: CarbonRightSizing
        config:
          energy-efficiency-target: "0.7"
          observation-window-days: "7"
          cpu-percentile: "0.95"
          memory-percentile: "0.95"
        acceptedResources:
          - kind: Deployment
            apiVersion: apps/v1
          - kind: StatefulSet
            apiVersion: apps/v1
          - kind: DaemonSet
            apiVersion: apps/v1
      - name: CarbonTemporalShifting
        config:
          low-carbon-start-hour: "0"
          low-carbon-end-hour: "6"
          high-carbon-gco2: "300"
          low-carbon-gco2: "120"
          observation-window-days: "7"
          min-energy-watts: "0.01"
        acceptedResources:
          - kind: Deployment
            apiVersion: apps/v1
          - kind: StatefulSet
            apiVersion: apps/v1
          - kind: DaemonSet
            apiVersion: apps/v1
          - kind: CronJob
            apiVersion: batch/v1
          - kind: Job
            apiVersion: batch/v1
      - name: CarbonSpatialShifting
        config:
          current-zone: "SE"
          comparison-zones: "NO,FI,DK,DE,PL,FR,GB"
          observation-window-days: "7"
          min-energy-watts: "0.01"
        acceptedResources:
          - kind: Deployment
            apiVersion: apps/v1
          - kind: StatefulSet
            apiVersion: apps/v1
          - kind: DaemonSet
            apiVersion: apps/v1

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: craned
  namespace: crane-system
  labels:
    app: craned
spec:
  replicas: 1
  selector:
    matchLabels:
      app: craned
  template:
    metadata:
      labels:
        app: craned
    spec:
      serviceAccountName: craned
      containers:
        - name: craned
          image: ekaterinadespotova/crane-kepler:carbon-recommenders-v15
          imagePullPolicy: Always
          env:
            - name: TZ
              value: UTC
            - name: CRANE_SYSTEM_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: ELECTRICITY_MAPS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: electricity-maps-secret
                  key: api-key
                  optional: true
            - name: ELECTRICITY_MAPS_ZONE
              value: "SE"
          command:
            - /craned
            - --prometheus-address=http://prometheus-kube-prometheus-prometheus.monitoring:9090
            - --feature-gates=Analysis=true,TimeSeriesPrediction=true,Autoscaling=false
            - --recommendation-configuration-file=/tmp/recommendation-config/config.yaml
            - --webhook-enabled=false
            - --leader-elect=false
            - --health-probe-bind-address=:8081
            - --metrics-bind-address=:8080
            - -v=4
          volumeMounts:
            - name: config
              mountPath: /tmp/recommendation-config
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8081
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
              scheme: HTTP
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: config
          configMap:
            name: recommendation-configuration

---
apiVersion: v1
kind: Service
metadata:
  name: craned
  namespace: crane-system
spec:
  selector:
    app: craned
  ports:
    - name: crane-server
      port: 8082
      targetPort: 8082
    - name: metrics
      port: 8080
      targetPort: 8080
