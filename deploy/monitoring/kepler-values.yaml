## Kepler helm values
## Enables ServiceMonitor so kube-prometheus-stack auto-scrapes Kepler

serviceMonitor:
  enabled: true
  ## Must match the prometheus operator's serviceMonitorSelector (we set it to {} = any)
  labels:
    release: prometheus

## Tolerate any taints so it runs on all nodes including system nodes
tolerations:
  - operator: Exists

## Container-level security context (privileged needed for eBPF/energy counters)
securityContext:
  privileged: true

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 200m
    memory: 256Mi
