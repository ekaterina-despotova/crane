name: Cleanup infrastructure

on:
  workflow_dispatch:

jobs:
  deploy:
    name: Cleanup of infrastructure
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: |
            {
              "clientId": "${{ secrets.AZURE_CLIENT_ID }}",
              "clientSecret": "${{ secrets.AZURE_CLIENT_SECRET }}",
              "subscriptionId": "${{ secrets.AZURE_SUBSCRIPTION_ID }}",
              "tenantId": "${{ secrets.AZURE_TENANT_ID }}"
            }

      - name: Delete k8s cluster
        working-directory: ./terraform/deploy-kubernetes-cluster
        run : |
          terraform init

          cancel_rolling_upgrades() {
            NRG=$(az aks show -g demoCarbonrg -n demo-carbon-aks --query nodeResourceGroup -o tsv 2>/dev/null || true)
            [ -z "$NRG" ] && return 0
            for VMSS in $(az vmss list -g "$NRG" --query '[].name' -o tsv 2>/dev/null); do
              STATUS=$(az vmss rolling-upgrade get-latest -g "$NRG" -n "$VMSS" --query runningStatus.code -o tsv 2>/dev/null || true)
              if [ "$STATUS" = "RollingForward" ]; then
                echo "Cancelling stuck rolling upgrade on $VMSS"
                az vmss rolling-upgrade cancel -g "$NRG" -n "$VMSS" || true
              fi
            done
          }

          for attempt in 1 2 3; do
            echo "=== destroy attempt $attempt ==="
            cancel_rolling_upgrades
            if terraform destroy -auto-approve; then
              exit 0
            fi
            echo "destroy failed; retrying in 30s"
            sleep 30
          done
          exit 1

