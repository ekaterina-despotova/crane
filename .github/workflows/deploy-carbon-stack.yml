name: Deploy Carbon Optimization Stack

on:
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy AKS, App, Prometheus + Kepler + Crane
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: |
            {
              "clientId": "${{ secrets.AZURE_CLIENT_ID }}",
              "clientSecret": "${{ secrets.AZURE_CLIENT_SECRET }}",
              "subscriptionId": "${{ secrets.AZURE_SUBSCRIPTION_ID }}",
              "tenantId": "${{ secrets.AZURE_TENANT_ID }}"
            }

      - name: Deploy AKS cluster
        working-directory: ./terraform/deploy-kubernetes-cluster
        run : |
          terraform init
          terraform apply -auto-approve

      - name: Get Terraform Outputs
        id: tf_outputs
        working-directory: ./terraform/deploy-kubernetes-cluster
        run: |
          echo "resource_group=$(terraform output -raw Resource_group_name)" >> $GITHUB_OUTPUT
          echo "cluster_name=$(terraform output -raw K8s_aks_name)" >> $GITHUB_OUTPUT

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group ${{ steps.tf_outputs.outputs.resource_group }} \
            --name ${{ steps.tf_outputs.outputs.cluster_name }} \
            --overwrite-existing

      - name: Checkout AKS application
        uses: actions/checkout@v4
        with:
          repository: ekaterina-despotova/aks-store-demo
          ref: main
          token: ${{ secrets.GH_PAT }}
          path: k8s-manifests

      - name: Deploy application
        working-directory: k8s-manifests
        run: |
          kubectl create namespace pets --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply -f aks-store-all-in-one.yaml -n pets


      - name: Create monitoring namespace
        run: kubectl create namespace monitoring --dry-run=client -o yaml | kubectl apply -f -

      - name: Add Prometheus Helm repo
        run: |
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo update

      - name: Deploy kube-prometheus-stack
        run: |
          helm upgrade --install prometheus prometheus-community/kube-prometheus-stack \
            --namespace monitoring \
            --values deploy/monitoring/prometheus-values.yaml \
            --timeout 10m

      - name: Wait for Prometheus operator
        run: |
          kubectl rollout status deployment/prometheus-kube-prometheus-operator \
            -n monitoring --timeout=180s

      - name: Create kepler namespace
        run: kubectl create namespace kepler --dry-run=client -o yaml | kubectl apply -f -

      - name: Add Kepler Helm repo
        run: |
          helm repo add kepler https://sustainable-computing-io.github.io/kepler-helm-chart
          helm repo update

      - name: Deploy Kepler
        run: |
          helm upgrade --install kepler kepler/kepler \
            --namespace kepler \
            --values deploy/monitoring/kepler-values.yaml \
            --timeout 5m

      - name: Wait for Kepler DaemonSet
        run: |
          kubectl rollout status daemonset/kepler \
            -n kepler --timeout=180s


      - name: Install Crane CRDs
        run: kubectl apply -f deploy/manifests/


      - name: Create crane-system namespace
        run: kubectl create namespace crane-system --dry-run=client -o yaml | kubectl apply -f -

      - name: Install Crane RBAC
        run: kubectl apply -f deploy/craned/rbac.yaml


      - name: Deploy craned with carbon recommenders
        run: |
          kubectl create secret generic electricity-maps-secret \
            -n crane-system \
            --from-literal=api-key=${{ secrets.ELM_API_KEY }} \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply -f deploy/crane/craned-deploy.yaml

      - name: Wait for craned to be ready
        run: |
          kubectl rollout status deployment/craned \
            -n crane-system --timeout=300s

      - name: Apply CarbonIdleResource rule
        run: kubectl apply -f examples/analytics/carbon-idle-rule.yaml

      - name: Apply CarbonRightSizing rule
        run: kubectl apply -f examples/analytics/carbon-rightsize-rule.yaml

      - name: Apply CarbonLoadShifting rule
        run: kubectl apply -f examples/analytics/carbon-loadshift-rule.yaml

      - name: Deploy Crane Dashboard
        run: kubectl apply -f deploy/crane/dashboard-deploy.yaml

      - name: Create Carbon Dashboard ConfigMap
        run: |
          kubectl create configmap crane-carbon-dashboard -n crane-system \
            --from-file=index.html=deploy/crane/carbon-dashboard/index.html \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: RBAC for cluster registration
        run: |
          kubectl create clusterrolebinding craned-secrets \
            --clusterrole=admin \
            --serviceaccount=crane-system:craned \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Restart dashboard to pick up ConfigMap
        run: |
          kubectl rollout restart deployment/crane-dashboard -n crane-system
          kubectl rollout status deployment/crane-dashboard -n crane-system --timeout=60s

      - name: Register cluster in craned
        run: |
          kubectl exec -n crane-system deploy/crane-dashboard -- \
            wget -qO- --post-data='{"clusters":[{"name":"demo-carbon-aks","craneUrl":"http://craned:8082","prometheusAddress":"http://prometheus-kube-prometheus-prometheus.monitoring:9090"}]}' \
            --header='Content-Type: application/json' \
            http://craned:8082/api/v1/cluster || true

      - name: Create Kepler Grafana dashboard
        run: |
          kubectl exec -n crane-system deploy/crane-dashboard -- \
            wget -qO- --post-data='{"dashboard":{"title":"Kepler Carbon Emissions","uid":"kepler-carbon","panels":[{"id":1,"title":"Energy per Pod (Watts)","type":"timeseries","gridPos":{"h":8,"w":24,"x":0,"y":0},"targets":[{"expr":"sum by (pod_name, container_namespace) (rate(kepler_container_package_joules_total{mode=\"dynamic\"}[5m]))","legendFormat":"{{container_namespace}}/{{pod_name}}"}],"datasource":{"type":"prometheus","uid":"prometheus"}},{"id":5,"title":"Energy per Container (Watts)","type":"timeseries","gridPos":{"h":8,"w":24,"x":0,"y":8},"targets":[{"expr":"rate(kepler_container_package_joules_total{mode=\"dynamic\"}[5m])","legendFormat":"{{container_namespace}}/{{pod_name}}/{{container_name}}"}],"datasource":{"type":"prometheus","uid":"prometheus"}},{"id":2,"title":"Total Cluster Energy (Watts)","type":"timeseries","gridPos":{"h":8,"w":12,"x":0,"y":16},"targets":[{"expr":"sum(rate(kepler_container_package_joules_total{mode=\"dynamic\"}[5m]))","legendFormat":"Total Cluster Watts"}],"datasource":{"type":"prometheus","uid":"prometheus"}},{"id":3,"title":"Energy per Namespace (Watts)","type":"piechart","gridPos":{"h":8,"w":12,"x":12,"y":16},"targets":[{"expr":"sum by (container_namespace) (rate(kepler_container_package_joules_total{mode=\"dynamic\"}[5m]))","legendFormat":"{{container_namespace}}"}],"datasource":{"type":"prometheus","uid":"prometheus"}},{"id":4,"title":"Node Energy (Watts)","type":"timeseries","gridPos":{"h":8,"w":24,"x":0,"y":24},"targets":[{"expr":"sum by (instance) (rate(kepler_node_package_joules_total{mode=\"dynamic\"}[5m]))","legendFormat":"{{instance}}"}],"datasource":{"type":"prometheus","uid":"prometheus"}}],"time":{"from":"now-1h","to":"now"},"refresh":"30s"},"overwrite":true}' \
            --header='Content-Type: application/json' \
            --header='Authorization: Basic YWRtaW46Y3JhbmUtZ3JhZmFuYQ==' \
            http://prometheus-grafana.monitoring/grafana/api/dashboards/db || true


      - name: Verify deployment
        run: |
          echo "=== Pods in monitoring ==="
          kubectl get pods -n monitoring
          echo ""
          echo "=== Pods in kepler ==="
          kubectl get pods -n kepler
          echo ""
          echo "=== Pods in crane-system ==="
          kubectl get pods -n crane-system
          echo ""
          echo "=== Recommendation Rules ==="
          kubectl get recommendationrules
          echo ""
          echo "=== Deployment complete ==="
