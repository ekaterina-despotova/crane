apiVersion: analysis.crane.io/v1alpha1
kind: RecommendationRule
metadata:
  name: carbon-rightsize-rule
  labels:
    analysis.crane.io/recommendation-rule-preinstall: "true"
spec:
  runInterval: 2m
  resourceSelectors:
    - kind: Deployment
      apiVersion: apps/v1
    - kind: StatefulSet
      apiVersion: apps/v1
    - kind: DaemonSet
      apiVersion: apps/v1
  namespaceSelector:
    any: true
  recommenders:
    - name: CarbonRightSizing
